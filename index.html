<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f4d36">

    <!--
      These are fallback/default tags only. Every route overrides
      title/description/canonical/OG via useSeo() (see
      src/composables/useSeo.ts), which runs on the client and — via
      `vite-ssg build` — gets baked into the static HTML for that route
      at build time too.
    -->
    <title>Orena Global — Verified Nigerian Commodity &amp; Wholesale Suppliers</title>
    <meta name="description" content=">Orena Global connects international buyers and Nigerian businesses with verified suppliers of agricultural commodities, wholesale groceries, and meal kits.">
    <link rel="canonical" href="https://orenag.com/">

    <!-- Open Graph / Twitter fallback -->
    <meta property="og:site_name" content="OrenAg">
    <meta property="og:type" content="website">
    <meta property="og:title" content=">Orena Global — Verified Nigerian Commodity &amp; Wholesale Suppliers">
    <meta property="og:description" content=">Orena Global connects international buyers and Nigerian businesses with verified suppliers of agricultural commodities, wholesale groceries, and meal kits.">
    <meta property="og:url" content="https://orenag.com/">
    <meta property="og:image" content="https://orenag.com/og-default.png">
    <meta property="og:locale" content="en_NG">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@orenag">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap">

    <!--
      Site-wide structured data (Organization + WebSite). This does NOT
      change per page, so it lives here rather than in useSeo(). Update
      logo/sameAs once real assets/social profiles exist — sameAs
      entries below are placeholders.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OrenAg",
        "url": "https://orenag.com",
        "logo": "https://orenag.com/logo.png",
        "description": "OrenAg connects international buyers and Nigerian businesses with verified suppliers of agricultural commodities, wholesale groceries, and meal kits.",
        "sameAs": [
          "https://x.com/orenag",
          "https://facebook.com/orenag",
          "https://instagram.com/orenag",
          "https://linkedin.com/company/orenag"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "OrenAg",
        "url": "https://orenag.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://orenag.com/products?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
